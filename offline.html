<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tryb offline – ZSEM Tech</title>
    <link rel="icon" href="./zsemtech_profile.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/dashboard-new.css">
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            background: var(--bg-main, #0f172a);
            color: var(--text-main, #f8fafc);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .offline-card {
            max-width: 520px;
            width: 100%;
            background: var(--panel-bg, #1e293b);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        .offline-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #fff;
        }
        .offline-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn-reload {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn-reload:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .btn-offline-module {
            background: rgba(148, 163, 184, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .btn-offline-module:hover {
            background: rgba(148, 163, 184, 0.15);
            color: #fff;
        }
        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 1.25rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-badge">
            ● Brak połączenia
        </div>
        <div class="offline-icon" aria-hidden="true">
            📡
        </div>
        <h1 class="offline-title">Jesteś w trybie offline</h1>
        <p class="offline-desc">
            Nie udało się załadować tej strony, ponieważ urządzenie nie ma aktywnego połączenia z internetem. Twoje lokalne postępy zostaną zsynchronizowane automatycznie po przywróceniu sieci.
        </p>
        <div class="offline-actions">
            <button class="btn-reload" onclick="window.location.reload()">
                Spróbuj połączyć ponownie
            </button>
            <a href="./flashcards.php" class="btn-offline-module">
                Powtarzaj fiszki (pamięć lokalna)
            </a>
            <a href="./practice.php" class="btn-offline-module">
                Tryb praktyczny / trening
            </a>
        </div>
    </div>
</body>
</html>
