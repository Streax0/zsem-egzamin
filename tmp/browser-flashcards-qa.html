<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards QA</title>
    <link rel="stylesheet" href="/assets/css/flashcards.css">
    <style>
        body { font-family: Inter, Arial, sans-serif; margin:0; padding:24px; background:#eef2f7; color:#0f172a; }
        .container-fluid { max-width:1240px; margin:auto; }
        .btn { border:1px solid #cbd5e1; background:#fff; padding:.65rem .8rem; border-radius:8px; }
        .btn-outline-danger { color:#b91c1c; }
        .btn-outline-primary { color:#1d4ed8; }
        .btn-outline-success { color:#15803d; }
        .form-select, .form-control { width:100%; padding:.65rem; border:1px solid #cbd5e1; border-radius:8px; }
        .row { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:.75rem; }
        .d-flex { display:flex; }
        .justify-content-between { justify-content:space-between; }
        .align-items-start { align-items:flex-start; }
        .align-items-center { align-items:center; }
        .gap-2 { gap:.5rem; }
        .gap-3 { gap:.75rem; }
        .mb-0 { margin-bottom:0; }
        .mb-1 { margin-bottom:.25rem; }
        .mb-2 { margin-bottom:.5rem; }
        .mb-3 { margin-bottom:.75rem; }
        .mb-4 { margin-bottom:1rem; }
        .mt-3 { margin-top:.75rem; }
        .small { font-size:.85rem; }
        .text-muted { color:#64748b; }
        .fw-bold { font-weight:800; }
        .w-100 { width:100%; }
        .flex-fill { flex:1; }
        @media (max-width: 680px) { .row { grid-template-columns:1fr; } body { padding:12px; } }
    </style>
</head>
<body>
<main class="content-body">
    <div class="container-fluid p-0 flashcard-shell">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1">Fiszki</h2>
                <p class="text-muted mb-0">Słownik pojęć i wybrane pytania testowe.</p>
            </div>
        </div>

        <section class="flashcard-qualification-grid" aria-label="Kwalifikacje fiszek">
            <button type="button" data-flashcard-qual-card="INF.02">INF.02<span>2 fiszki</span></button>
        </section>

        <section class="flashcard-stage">
            <div>
                <div class="flashcard-tools mb-3">
                    <div class="row g-2 align-items-end">
                        <div>
                            <label>Zestaw</label>
                            <select id="flashcardSet" class="form-select">
                                <option value="all">Wszystkie</option>
                                <option value="questions">Baza pytań</option>
                                <option value="dictionary">Słownik</option>
                                <option value="wrong">Tylko błędne z 3h</option>
                                <option value="due">Do powtórki teraz</option>
                            </select>
                        </div>
                        <div>
                            <label>Kwalifikacja</label>
                            <select id="flashcardQual" class="form-select">
                                <option value="all">Wszystkie</option>
                                <option value="INF.02">INF.02</option>
                            </select>
                        </div>
                        <div>
                            <label>Szukaj</label>
                            <input id="flashcardSearch" class="form-control" placeholder="DNS">
                        </div>
                    </div>
                    <div class="flashcard-study-builder mt-3">
                        <button type="button" data-flashcard-study="all" class="active">Wszystkie tematy</button>
                        <button type="button" data-flashcard-study="mixed">Mieszane źródła</button>
                        <button type="button" data-flashcard-study="wrong">Powtórka błędnych pojęć</button>
                    </div>
                    <div class="flashcard-difficulty-filter mt-3">
                        <button type="button" data-flashcard-difficulty="all" class="active">Wszystkie</button>
                        <button type="button" data-flashcard-difficulty="easy">Łatwe</button>
                        <button type="button" data-flashcard-difficulty="medium">Średnie</button>
                        <button type="button" data-flashcard-difficulty="hard">Trudne</button>
                    </div>
                    <div class="flashcard-progress" data-flashcard-progress></div>
                </div>

                <div class="flashcard-deck">
                    <article id="flashcardCard" class="flashcard-card" tabindex="0" role="button" aria-live="polite"></article>
                </div>
                <div class="flashcard-actions mt-3">
                    <button class="btn btn-outline-danger" data-rate="hard">Trudne</button>
                    <button class="btn btn-outline-primary" data-rate="medium">Średnie</button>
                    <button class="btn btn-outline-success" data-rate="easy">Łatwe</button>
                </div>
                <div class="flashcard-list-panel mt-3">
                    <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                        <h5 class="fw-bold mb-0">Lista fiszek</h5>
                        <span id="flashcardListCount" class="small text-muted"></span>
                    </div>
                    <div id="flashcardList" class="flashcard-list"></div>
                    <button type="button" class="btn btn-outline-primary w-100 mt-3" data-flashcard-load-more>Załaduj więcej</button>
                </div>
            </div>

            <aside class="flashcard-side">
                <h5 class="fw-bold mb-3">Propozycja fiszki</h5>
                <div class="flashcard-request-note">Fiszki są teraz moderowane.</div>
                <hr>
                <div class="small text-muted" id="flashcardMeta"></div>
                <div class="flashcard-shortcuts">
                    <span>Spacja: obrót</span>
                    <span>←: trudne</span>
                    <span>→: łatwe</span>
                    <span>↓: średnie</span>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <a id="flashcardWiki" class="btn flex-fill">W</a>
                    <a id="flashcardYoutube" class="btn flex-fill">Y</a>
                </div>
            </aside>
        </section>
    </div>
</main>
<script>
window.zsemFlashcards = {
    cards: [
        { qualification: 'INF.02', front: 'DNS', back: 'DNS zamienia nazwy domen na adresy IP.', source: 'Słownik', difficulty: 'easy', wiki: 'https://example.com', youtube: 'https://example.com/y' },
        { qualification: 'INF.02', front: 'Adres IP', back: 'Unikalny adres interfejsu w sieci.', source: 'Baza pytań', difficulty: 'medium', wiki: '', youtube: 'https://example.com/ip' }
    ]
};
</script>
<script src="/assets/js/flashcards.js"></script>
</body>
</html>
